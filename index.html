<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blacksmith Battles</title>
<meta name="theme-color" content="#15120f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: a single-column forge counter. Resource strip on top, tabbed stations below, modals for rolls. Deliberately single dark theme: soot, ember, steel. */
:root{
  --bg:#15120f; --panel:#1f1a16; --panel2:#29221c; --line:#3b3029;
  --fg:#f1e8dc; --muted:#a9998a; --ember:#ff8a3d; --ember-soft:rgba(255,138,61,.16);
  --steel:#9fb6cc; --gold:#e9c45e; --good:#72d394; --bad:#ef5f57; --violet:#b69cff;
  --display:"Cinzel",Georgia,"Times New Roman",serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:14px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-size:26px;letter-spacing:.04em;margin:0;line-height:1.1;text-wrap:balance}
h1 span{color:var(--ember)}
h2{font-family:var(--display);font-size:17px;margin:0;letter-spacing:.04em}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0;font-weight:600}
.sub{color:var(--muted);margin:2px 0 0;font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.res{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-variant-numeric:tabular-nums;font-weight:600;display:flex;gap:6px;align-items:center;white-space:nowrap}
.chip small{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:5px max(8px,env(safe-area-inset-left,0px)) max(24px,calc(8px + env(safe-area-inset-bottom,0px))) max(8px,env(safe-area-inset-right,0px))} /* room for the iPhone home indicator */
.tabs .navgrid{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tab{background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--muted);font:600 12px var(--body);padding:9px 2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:40px}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--ember);background:var(--ember-soft)}
.tab:disabled{opacity:.35;cursor:default}
/* World strip (Jonathan, 2026-11-17): one wide scene; the camera slides to the location of the button you press. Placeholder shapes until real art. */
.hud{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:max(6px,env(safe-area-inset-top,0px));box-shadow:0 10px 14px -6px rgba(0,0,0,.55)}
.hud .res{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-bottom:6px}
.hud .chip{flex-direction:column;gap:0;align-items:center;justify-content:center;border-radius:8px;padding:4px 2px;min-width:0;line-height:1.15;font-size:13px}
.hud .chip small{font-size:9px;letter-spacing:.06em}
/* Art strip sized like the finished portrait screen: 180x128 world on a 180x320 phone screen */
.world{--k:clamp(1,calc((min(100vw,980px) - 32px) / 210px),2.2);position:relative;height:clamp(150px,calc((min(100vw,980px) - 32px) * .71),300px);border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#0e0c14}
.strip{position:absolute;inset:0;display:flex;transition:transform .7s cubic-bezier(.45,0,.25,1);will-change:transform}
.loc{position:relative;flex:0 0 100%;height:100%;overflow:hidden}
.loc .sky{position:absolute;inset:0}
.loc .gnd{position:absolute;left:0;right:0;bottom:0;height:calc(12px * var(--k));background:#231c16;border-top:2px solid #3a2e24}
.loc .glow{position:absolute;bottom:calc(8px * var(--k));width:calc(120px * var(--k));height:calc(90px * var(--k));border-radius:50%;filter:blur(18px);opacity:.55;pointer-events:none}
.loc .bld{position:absolute;bottom:calc(12px * var(--k));transform:scale(var(--k));transform-origin:bottom left}
.loc .sign{position:absolute;top:8px;left:10px;font:700 11px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--fg);background:rgba(10,8,6,.55);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:3px 7px}
.loc .crowd{position:absolute;left:4%;right:4%;bottom:calc(6px * var(--k));height:60px;transform:scale(var(--k));transform-origin:bottom left;z-index:1}
.crowd .fig{position:absolute}
.fig{width:7px;height:13px;border-radius:3px 3px 1px 1px;position:relative;animation:bob 1.8s ease-in-out infinite}
.fig::before{content:"";position:absolute;left:0;top:-7px;width:7px;height:7px;border-radius:50%;background:inherit;filter:brightness(1.25)}
@keyframes bob{50%{transform:translateY(-2px)}}
.loc.locked .sky{filter:grayscale(1) brightness(.45)}
.loc.locked .bld,.loc.locked .glow,.loc.locked .crowd{opacity:.15}
.loc.locked .sign{color:var(--muted)}
.you{position:absolute;left:50%;bottom:30px;width:9px;height:16px;margin-left:-4px;border-radius:3px 3px 1px 1px;background:var(--ember);z-index:2;box-shadow:0 0 10px rgba(255,138,61,.5)}
.you::before{content:"";position:absolute;left:1px;top:-8px;width:8px;height:8px;border-radius:50%;background:#ffd2a8}
.you.walk{animation:walk .28s ease-in-out infinite}.you.left{transform:scaleX(-1)}
@keyframes walk{50%{translate:0 -3px}}
@media (prefers-reduced-motion:reduce){.strip{transition:none}.fig,.you.walk{animation:none}}
.tab:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.b{font:600 13px var(--body);color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px 12px;cursor:pointer}
button.b:hover:not(:disabled){border-color:var(--ember)}
button.b:disabled{opacity:.42;cursor:not-allowed}
button.primary{background:var(--ember);border-color:var(--ember);color:#1b120b}
button.primary:hover:not(:disabled){filter:brightness(1.08)}
button.sm{padding:5px 9px;font-size:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:8px}
.stepper .b{width:44px;height:44px;padding:0;font-size:22px;line-height:1;border-radius:50%}
.stepper .sv{min-width:64px;text-align:center;display:flex;flex-direction:column;line-height:1.1}
.stepper .sv b{font-size:26px}.slider .sv{min-width:150px;cursor:pointer}.slider .sv b{font-size:20px}
.uhead{cursor:pointer;flex:1;min-width:0}.uline{line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}.chev{color:var(--muted);font-size:11px}
.vein .pertap{font:700 16px var(--body);color:var(--gold)}.autorate{text-align:center;margin:10px 0 0;color:var(--muted)}.autorate b{color:var(--gold)}.stepper .sv span{font-size:12px;color:var(--muted)}
.stepcost{text-align:center;margin:4px 0 0;font-weight:600;color:var(--ember)}
.seg button{font:600 13px var(--body);background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:7px;padding:7px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--ember);background:var(--ember-soft)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.muted{color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
/* forge */
.anvil{display:flex;flex-direction:column;gap:12px}
.track{position:relative;height:64px;border-radius:10px;background:linear-gradient(90deg,#2a1d15,#3a2416 50%,#2a1d15);border:1px solid var(--line);overflow:hidden;cursor:pointer;touch-action:manipulation}
.zone{position:absolute;top:0;bottom:0;background:rgba(255,138,61,.28);border-left:1px solid rgba(255,170,110,.6);border-right:1px solid rgba(255,170,110,.6)}
.zone i{position:absolute;top:0;bottom:0;left:30%;width:40%;background:rgba(255,214,150,.45);box-shadow:0 0 18px rgba(255,170,90,.8)}
.marker{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:var(--fg);border-radius:2px;box-shadow:0 0 8px rgba(255,255,255,.7)}
.track.idle .zone,.track.idle .marker{opacity:.25}
.track.ring{height:210px;background:radial-gradient(circle at 50% 45%,#2a1f45,#151022 75%);border-color:#4a3a70}
.rune{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;pointer-events:none}
.rtarget{position:absolute;inset:0;border-radius:50%;border:4px solid rgba(200,170,255,.95);box-shadow:0 0 16px rgba(170,130,255,.75),inset 0 0 12px rgba(170,130,255,.5)}
.aring{position:absolute;inset:0;border-radius:50%;border:3px solid #fff;box-shadow:0 0 10px rgba(255,255,255,.6);will-change:transform}
.rune b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;color:#e6dbff;text-shadow:0 0 10px #a78bfa}
.track.idle .rune{opacity:.35}
.pips{display:flex;gap:6px;flex-wrap:wrap}
.pip{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted)}
.pip.p{background:var(--ember);color:#1b120b;border-color:var(--ember)}
.pip.g{background:var(--ember-soft);color:var(--ember);border-color:var(--ember)}
.pip.m{color:var(--bad);border-color:var(--bad)}
.forge-shake{animation:shake .18s}
@keyframes shake{25%{transform:translate(-3px,1px)}50%{transform:translate(3px,-1px)}75%{transform:translate(-2px,0)}}
.sparks{position:absolute;inset:0;pointer-events:none}
.spark{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffd08a;box-shadow:0 0 6px #ff9a40;animation:spark .5s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.tlabel{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 12px;font-weight:600;font-size:13px;color:var(--fg);pointer-events:none}
.dig{display:grid;grid-template-columns:1fr;gap:12px}
.vein{position:relative;overflow:hidden;height:170px;border-radius:12px;border:1px solid var(--line);background:radial-gradient(circle at 30% 30%,#7a5f46,#3a2c22 72%);color:var(--fg);font:600 14px var(--body);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.vein .big{font-family:var(--display);font-size:20px}
.vein:hover{border-color:var(--ember)}
.vein.bump{animation:bump .12s}
@keyframes bump{50%{transform:scale(.97)}}
.pop{position:absolute;font-weight:800;color:var(--gold);pointer-events:none;white-space:nowrap;animation:pop .7s ease-out forwards}
@keyframes pop{from{transform:translate(-50%,-50%)}to{transform:translate(-50%,-160%);opacity:0}}
@media (max-width:500px){.dig{grid-template-columns:1fr}.vein{height:120px}}
.callout{font-family:var(--display);font-size:20px;min-height:28px;color:var(--ember)}
/* orders */
.order{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border:1px dashed var(--line);border-radius:8px}
.order b{font-weight:600}
.tline .row{flex-wrap:nowrap;flex-shrink:0}.tline .row .b{white-space:nowrap}
.tline{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.orders{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}
/* weapons */
.weps{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.wep{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.wep.eq{border-color:var(--steel)}
.wep.cr{border-color:var(--bad)}
.wep .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.wep .nm{font-weight:700;font-size:15px}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.g0{color:#b8a898}.g1{color:#cfd8c2}.g2{color:#7fc4ff}.g3{color:var(--violet)}.g4{color:var(--gold)}.g5,.g6,.g7{color:#ff9a5c}.g8,.g9,.g10{color:#ff6f91}.g11,.g12,.g13{color:#5ee0d0}.g14,.g15,.g16{color:#ffd84d}.g17,.g18,.g19{color:#f5f5ff;text-shadow:0 0 6px #b98cff}
.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-variant-numeric:tabular-nums}
.stats>*{background:var(--panel);border-radius:6px;padding:4px 0;text-align:center;font-weight:700;font-size:13px}
.stats button{border:1px solid transparent;color:inherit;font:inherit;font-weight:700;font-size:13px;cursor:pointer;width:100%}
.stats button:hover,.stats button.on{border-color:var(--accent)}
.statinfo{background:var(--panel);border-left:3px solid var(--accent);border-radius:6px;padding:6px 8px;font-size:12px;line-height:1.45}
.stats small{display:block;font-size:9.5px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.stats .up{color:var(--good)}
.slots{display:flex;gap:3px;align-items:center}
.slot{width:12px;height:12px;border-radius:3px;border:1px solid var(--line)}
.slot.ok{background:var(--good);border-color:var(--good)}
.slot.no{background:transparent;border-color:var(--bad);position:relative}
.slot.no::after{content:"";position:absolute;inset:5px -1px;background:var(--bad);transform:rotate(-45deg)}
.empty{border:1px dashed var(--line);border-radius:9px;padding:22px;text-align:center;color:var(--muted)}
/* battle */
.squad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.squad{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lines{display:flex;flex-direction:column;gap:6px}
.line{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.line.foe .hp i{background:var(--bad)}
.tr{font-size:10.5px;color:var(--violet);font-weight:600}
.fl.h{color:var(--good)}
.sq{border:1px dashed var(--line);border-radius:8px;padding:8px;min-height:74px;display:flex;flex-direction:column;gap:4px;font-size:12px}
.sq.full{border-style:solid;background:var(--panel2)}
.sq .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start}
.arena .vs{font-family:var(--display);color:var(--muted);align-self:center}
.side{display:flex;flex-direction:column;gap:6px;min-width:0}
.atk{height:3px;background:var(--line);border-radius:2px;margin-top:3px;overflow:hidden}.atk i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s linear}.atk.full i{background:var(--good)}
.unit{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12px;min-width:0}
.unit .un{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp{height:7px;border-radius:4px;background:#3a2b25;margin-top:5px;overflow:hidden}
.hp i{display:block;height:100%;background:var(--good);transition:width .12s}
.side.foe .hp i{background:var(--bad)}
.unit.dead{opacity:.35}
.unit.hit{animation:hit .2s}
@keyframes hit{0%{background:#5a2b21}100%{background:var(--panel2)}}
.fl{position:absolute;right:8px;top:2px;font-weight:800;font-variant-numeric:tabular-nums;animation:fl .7s ease-out forwards;pointer-events:none}
.fl.c{color:var(--gold);font-size:15px}
@keyframes fl{to{transform:translateY(-18px);opacity:0}}
.log{font-size:12px;color:var(--muted);max-height:150px;overflow:auto;display:flex;flex-direction:column-reverse;gap:2px;font-variant-numeric:tabular-nums}
.log .w{color:var(--good)}.log .l{color:var(--bad)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(8,6,5,.72);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.scrolls{display:flex;flex-direction:column;gap:6px}
.scr{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel2)}
.scr .od{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.roll{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 0}
.glyph{width:120px;height:120px;border-radius:50%;border:2px solid var(--ember);display:grid;place-items:center;font-family:var(--display);font-size:42px;color:var(--ember);box-shadow:0 0 30px var(--ember-soft)}
.glyph.spin{animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(.94);box-shadow:0 0 14px var(--ember-soft)}to{transform:scale(1.05);box-shadow:0 0 46px rgba(255,138,61,.45)}}
.glyph.ok{border-color:var(--good);color:var(--good);box-shadow:0 0 50px rgba(114,211,148,.4)}
.glyph.no{border-color:var(--muted);color:var(--muted);box-shadow:none}
.glyph.crack{border-color:var(--bad);color:var(--bad);box-shadow:0 0 50px rgba(239,95,87,.45);animation:shake .3s 2}
.result{font-family:var(--display);font-size:22px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(136px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--ember);border-radius:8px;padding:9px 14px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
label.ck{display:flex;gap:6px;align-items:center;font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>

<div class="wrap">
  <div class="hud"><div class="res" id="res"></div>
  <div class="world" id="world" aria-hidden="true"><div class="strip" id="strip"></div></div></div>
  <div id="view"></div>
  <nav class="tabs" role="tablist"><div class="navgrid">
    <button class="tab" role="tab" data-t="mine" data-n="Mine" aria-selected="true">Mine</button>
    <button class="tab" role="tab" data-t="shop" data-n="Workshop" aria-selected="false">Workshop</button>
    <button class="tab" role="tab" data-t="upg" data-n="Upgrades" aria-selected="false">Upgrades</button>
    <button class="tab" role="tab" data-t="forge" data-n="Forge" aria-selected="false">Forge</button>
    <button class="tab" role="tab" data-t="sanctum" data-n="Sanctum" aria-selected="false">Sanctum</button>
    <button class="tab" role="tab" data-t="orders" data-n="Orders" aria-selected="false">Orders</button>
    <button class="tab" role="tab" data-t="armory" data-n="Armory" aria-selected="false">Armory</button>
    <button class="tab" role="tab" data-t="library" data-n="Library" aria-selected="false">Library</button>
    <button class="tab" role="tab" data-t="barracks" data-n="Barracks" aria-selected="false">Barracks</button>
    <button class="tab" role="tab" data-t="fight" data-n="Fight" aria-selected="false">Fight</button>
  </div></nav>
</div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
(()=>{
const ME={};window.__bbToyOwner=ME;const owns=()=>window.__bbToyOwner===ME; // only the newest copy of the page runs
// Materials unlock by beating the previous material's Warden on Expeditions (every 3rd stage), not by renown.
// Costs are fitted to a pacing model so the gates land at roughly 5, 10, 20, 40 and 80 minutes of active play.
// Ore is the only forging cost (coal was cut). Costs are the old ore+coal total, since every tap now goes to ore.
// Base ore for a 5-slam blank (doubled 2026-11-14 because weapons felt cheap). Bigger blanks cost base × slams ÷ 5.
const MATS={Copper:{m:1,ore:60},Bronze:{m:1.25,ore:1440},Iron:{m:1.5,ore:9000},
  Steel:{m:2.2,ore:27000},Moonsilver:{m:3,ore:84000},Starmetal:{m:4,ore:330000}}; // ore = a 3-slam blank

function stats(w){const a=ARCH[w.arch].b,k=MATS[w.mat].m*starMult(starsOf(w)),md=w.core&&CORES[w.core]?CORES[w.core].mods:{},sp=w.id?UN[specOf(w.arch)]:null,sb=sp?1+0.03*(w.spec!=null?w.spec:U(sp.k)):1; // specialist bonus is locked in when forged (Jonathan, 2026-11-16)
  return ST.map((s,i)=>Math.round(a[i]*(s==='Haste'?Math.min(k,7):k)*(md[s]||(s==='Magic'?md.Might:0)||1)*(sp&&sp.sig.includes(s)?sb:1))+(w.etch[s]||0))} // specialists boost their weapon's two signature stats
// Power: offense (Might or Magic x2, Crit, Haste x2) + defense (Defense, Magic Defense x0.6, Vigor/4) + traits (15 each, copies with falloff).
// With a squad slot, offense is halved when the weapon can't reach from there (it waits until the line steps forward).
function power(w,slot){const[m,mg,cr,h,df,md,v]=stats(w),g=df+md*.6;let off=(m+mg)*2+Math.min(CRIT_CAP,cr)+h*2;if(slot!=null&&!canReach(w.arch,slot,squadSlots()))off*=.5;

  return Math.round(off+g+v/4+tr)}

// Baseline: 1 ore of blank = 1 gold for a Superior weapon. Fine sells at a loss, Masterwork and Exalted at a profit; etching moves it (see etchMult).
// Stars = the forging score (Perfect 2, Good 1). Every star adds 2% to the weapon's stats, and the price follows stars:
// 4 stars (Fine) sells for one 3-slam blank of ore, and every 2 more stars doubles it (a Perfect slam pays for its doubled ore).
const starsOf=w=>w.stars!=null?w.stars:(w.g?GRADE_AT[w.g-1]:2); // older weapons and enemies: their grade's minimum
const starBonus=w=>Math.max(0,starsOf(w)-(w.g?GRADE_AT[w.g-1]:0)); // stars above the grade's minimum; the grade itself carries the rest
// Etching and price (Jonathan, 2026-11-16): price follows what the scrolls did to the weapon. Every 1% of Power gained (or lost, e.g. a bad Wild roll) moves
// the price 2%, and every failed slot (etch or trait) takes 10% off a clean weapon's price.
const fails=w=>w.res.filter(r=>r==='no').length+(w.tfail||0);
const etchMult=w=>{const clean=power({...w,etch:{},traits:[]}),now=power(w);return Math.max(.2,(1+2*(now/Math.max(1,clean)-1))*(1-0.1*fails(w)))};
const priceMult=n=>Math.pow(2,(Math.min(n,20)-4)/2)*Math.pow(1.03,Math.max(0,n-20)); // x2 per 2 stars up to 20, then +3% a star
const sellPrice=w=>Math.max(1,Math.round(MATS[w.mat].ore*priceMult(starsOf(w))*etchMult(w)*(w.state===1?.5:1)*(1+0.15*S.shop+0.02*U('merchant'))));

let resetArm=false;

/* ---------- forge minigame ---------- */

  const bc=blankCost(pick.mat); if(S.ore<bc){toast(`Need ${fmtN(bc)} ore. Dig in the Mine.`);return}
  S.ore-=bc; let core=null;if(pick.core&&(S.cores[pick.core]||0)>0){core=pick.core;S.cores[core]--;if(!S.cores[core])pick.core=null}
  F={arch:pick.arch,mat:pick.mat,core,size:blankSize(),res:[],pos:0,dir:1,speed:62,zl:0,last:0,done:false,ring:isMagic(pick.arch),s:3,rx:50,ry:50};
  placeZone(); render(); loop.t=performance.now(); requestAnimationFrame(loop);
}
function placeZone(){const w=zoneW();F.zl=8+Math.random()*(84-w);if(F.ring){F.rx=14+Math.random()*72;F.ry=24+Math.random()*52;F.s=3}}
// Magic weapons are bound in the Sanctum (Jonathan, 2026-11-17). The binding ring has its own milestones on the Arcanist: 5/20/40 widen it, 10/30/50 slow it 7% each.
const isMagic=a=>a==='Staff'||a==='Grimoire';

const atStation=()=>tab==='forge'||tab==='sanctum';
const ringW=()=>14+5*SMITH_GLOW.filter(n=>U('arcanist')>=n).length;
const ringSlow=()=>1-0.07*SMITH_SLOW.filter(n=>U('arcanist')>=n).length;
const ringTol=()=>ringW()/70; // Good if the ring's scale is within this of 1; Perfect within 40% of it (same shares as the bar)
function loop(now){
  if(!F||F.done)return;
  const dt=Math.min(.05,(now-loop.t)/1000);loop.t=now;
  if(F.ring){F.s-=F.speed*ringSlow()/62*1.25*dt;const a=$('#aring');if(a)a.style.transform=`scale(${Math.max(0,F.s)})`;
    if(F.s<1-ringTol()*1.1){strike('M');if(!F||F.done)return}}
  else{F.pos+=F.dir*F.speed*smithSlow()*dt; if(F.pos>100){F.pos=100;F.dir=-1} if(F.pos<0){F.pos=0;F.dir=1}
  const m=$('#marker'); if(m)m.style.left=F.pos+'%';}
  requestAnimationFrame(loop);
}
function drawTrack(){if(!F)return;if(F.ring){const r=$('#rune');if(r){r.style.left=F.rx+'%';r.style.top=F.ry+'%'}const a=$('#aring');if(a)a.style.transform=`scale(${F.s})`;return}const z=$('#zone');if(z){z.style.left=F.zl+'%';z.style.width=zoneW()+'%'}const m=$('#marker');if(m)m.style.left=F.pos+'%'}
function strike(force){
  if(!F||F.done)return;
  const now=performance.now(),w=zoneW(),p=F.ring?F.rx:F.pos,off=Math.abs(F.s-1),tol=ringTol();

  $('#callout').textContent=msg;$('#pips').innerHTML=pipsHtml();

function sparks(p,n,y=50){const s=$('#sparks');if(!s)return;for(let i=0;i<n;i++){const e=document.createElement('span');e.className='spark';e.style.left=p+'%';e.style.top=y+'%';e.style.setProperty('--dx',(Math.random()*120-60)+'px');e.style.setProperty('--dy',(Math.random()*-60-10)+'px');s.appendChild(e);setTimeout(()=>e.remove(),520)}}

   <p class="note" style="text-align:center;margin:0">${score} of ${maxStars(size)} stars${missed?` (−${lost} for the miss)`:''} · stats x${fmtX(starMult(score))}${GR[g+1]?` · ${GR[g+1].n} at ${GR[g+1].at}`:''} · Power ${power(w)} · ${GR[g].s} etch slots · ${traitSlots(w)} trait slot${traitSlots(w)===1?'':'s'}</p>

const fmtX=x=>x<100?x.toFixed(2):fmtN(x);

  return `<div class="statinfo" style="margin-top:6px">${L.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`}
const scrollName=k=>k.endsWith('|')?'a Wild scroll':'a '+k.replace('|',' scroll of ');
const bonusScroll=()=>Math.random()<.05*S.ink?`, and a lucky ${scrollName(dropScroll()).slice(2)}`:'';
/* ---------- misc ---------- */
function autoRow(){if(U('prospector')<10)return '';const c=autoCost(),l=S.autopick||0;
  return `<div class="order"><div><b>Auto-pick</b> · level ${l}<div class="note">Swings your pickaxe ${l} time${l===1?'':'s'} a second for you (${Math.round(l*orePerTap())} ore/s now). +1 swing a second per level.</div></div><button class="b sm" data-autopick="1" ${S.gold<c?'disabled':''}>${fmtN(c)} gold</button></div>`}
function mastRows(){return UNITS.filter(u=>mastOpen(u.k)||(S.mast||{})[u.k]).map(u=>{const n=(S.mast||{})[u.k]||0,open=mastOpen(u.k),c=mastCost(u.k);
  return `<div class="order"><div><b>${u.n} mastery</b> · level ${n}<div class="note">${u.n}s dig +${n*10}% ore now. Every 100 ${u.n}s (and 10 more Researchers) opens another +10%.</div></div>${open?`<button class="b sm" data-mast="${u.k}" ${S.ore<c?'disabled':''}>${fmtN(c)} ore</button>`:`<span class="note">Next at ${100*(n+1)} ${u.n}s, ${10*(n+1)} Researchers</span>`}</div>`}).join('')}
function dig(btn,e){
  const n=orePerTap();S.ore+=n;tally().taps=(tally().taps||0)+1;chips();
  const r=btn.getBoundingClientRect(),p=document.createElement('span');p.className='pop';p.textContent=`+${n} ore`;
  p.style.left=((e.clientX||r.left+r.width/2)-r.left)+'px';p.style.top=((e.clientY||r.top+r.height/2)-r.top)+'px';btn.appendChild(p);setTimeout(()=>p.remove(),700);
  btn.classList.remove('bump');void btn.offsetWidth;btn.classList.add('bump');
}
function showModal(html){$('#modal').innerHTML=`<div class="modal"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`}
function closeModal(){$('#modal').innerHTML='';etchId=null}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

document.addEventListener('click',e=>{if(!owns())return;
  const t=e.target.closest('button,[data-close],#track,[data-scrinfo],[data-uinfo],[data-finfo]');if(!t)return;const d=t.dataset;
  if(d.uinfo){uOpen=uOpen===d.uinfo?null:d.uinfo;render();return}
  if(d.finfo){fInfo=fInfo===d.finfo?null:d.finfo;render();return}
  if(d.scrinfo){scrInfo=scrInfo===d.scrinfo?null:d.scrinfo;if(document.querySelector('[data-use]')&&etchId!=null)etchModal(etchId);else render();return}
  if(t.classList.contains('tab')){if(tab!==d.t)window.scrollTo({top:0});tab=d.t;resetArm=false;render();return}
  if(t.id==='track'){if(F)strike();else startForge();return}
  if(t.id==='quench'){if(F&&!F.done&&F.res.length){F.done=true;finishForge()}return}
  if(t.id==='tapore'){dig(t,e);return}
  if(d.arch){pick.arch=d.arch;render()}
  else if(d.mat){pick.mat=d.mat;render()}
  else if(d.size){pick.size=+d.size;render()}
  else if(d.core!==undefined&&t.closest('.anvil')){pick.core=d.core||null;render()}
  else if(t.id==='heat')startForge();
  else if(t.id==='strike')strike();
  else if(d.forgeorder!==undefined){const o=S.orders[+d.forgeorder];pick.arch=o.arch;pick.mat=o.mat;tab=stationOf(o.arch);render();toast(`Set to ${o.mat} ${o.arch}. Heat the blank and aim for ${GR[o.minG].n} or better.`)}
  else if(d.skip!==undefined){openSlot(+d.skip);save();render()}
  else if(d.etch)etchModal(+d.etch);
  else if(d.use)useScroll(d.use);
  else if(d.again)etchModal(etchId);
  else if(d.buy){const s=SC[d.buy],st=d.buy==='Trait'?$('#btrait').value:$('#bstat').value;const pr=priceOf(d.buy);if(S.gold>=pr){S.gold-=pr;const k=d.buy+'|'+st;S.scrolls[k]=(S.scrolls[k]||0)+1;save();etchModal(etchId);chips()}}
  else if(d.close!==undefined){closeModal();if(d.close)tab=d.close;render()}
  else if(d.eq){const id=+d.eq;if(S.squad.includes(id))S.squad=S.squad.map(i=>i===id?null:i);else{const k=S.squad.slice(0,squadSlots()).indexOf(null);if(k<0){toast('Squad is full. Remove someone first.');return}S.squad[k]=id}save();render()}
  else if(d.stat){const[id,st]=d.stat.split('|');statOpen=statOpen.id===+id&&statOpen.st===st?{id:null,st:null}:{id:+id,st};render()}
  else if(d.pick!==undefined){pickModal(+d.pick)}
  else if(d.put){const[i,id]=d.put.split('|').map(Number),at=S.squad.indexOf(id);if(at>=0)S.squad[at]=S.squad[i];S.squad[i]=id;save();closeModal();render()}
  else if(d.lock){const w=byId(+d.lock);if(w){w.locked=!w.locked;save();render()}}
  else if(d.uneq){S.squad=S.squad.map(i=>i===+d.uneq?null:i);save();render()}
  else if(d.mv){const i=+d.mv;[S.squad[i-1],S.squad[i]]=[S.squad[i],S.squad[i-1]];save();render()}
  else if(d.sell||d.deliver){const w=byId(+(d.sell||d.deliver));if(!w)return;if(S.squad.includes(w.id)){toast('Unequip this weapon before selling or delivering it.');return}if(w.locked){toast('Unlock this weapon before selling or delivering it.');return}tally().sold++;let price=sellPrice(w),ren=0;
    if(d.deliver){const oi=orderFor(w);if(oi<0){toast('Unequip this weapon before delivering it.');return}{price=Math.round(price*S.orders[oi].mult);ren=S.orders[oi].ren;openSlot(oi)}}
    closeModal();S.gold+=price;S.renown+=ren;S.weapons=S.weapons.filter(x=>x!==w);S.squad=S.squad.map(i=>i===w.id?null:i);save();render();toast(`Sold ${wName(w)} for ${price} gold${ren?`, +${ren} renown`:''}`)}
  else if(d.mend){const w=byId(+d.mend);if(w&&S.gold>=mendCost()){S.gold-=mendCost();w.state=2;if(w.res.length>maxSlots(w))w.res.length=maxSlots(w);save();render();toast('Mended. The scar costs one slot.')}}
  else if(d.ut){upgTab=d.ut;resetArm=false;render()}
  else if(d.hire){const k=d.hire,c=unitCost(k);if(S.ore>=c){const before=reached(k);S.ore-=c;S.units[k]=U(k)+1;
    const after=reached(k);if(after>before){toast(`${UN[k].n} milestone: ${UN[k].ms[after-1][1]}`);syncOrders()}save();render()}}
  else if(d.learn||d.rankup){const[h,k]=(d.learn||d.rankup).split('|'),tt=S.titles[+h],r=(tt[k]||0)+1,c=titleCost(r);
    if(S.gold>=c&&r<=TITLE_MAX&&(tt[k]||Object.keys(tt).length<titleSlotsFor(+h))){S.gold-=c;tt[k]=r;save();render()}}
  else if(d.forget){const[h,k]=d.forget.split('|');delete S.titles[+h][k];save();render()}
  else if(d.gacha){if((S.frags||0)>=FRAG_COST){S.frags-=FRAG_COST;const k=dropScroll(true);save();render();toast(`Your Scribes hand you ${scrollName(k)}`)}}
  else if(d.breakdown){const k=d.breakdown,g=k.split('|')[0];if(S.scrolls[k]>0){S.scrolls[k]--;if(!S.scrolls[k])delete S.scrolls[k];S.frags=(S.frags||0)+(FRAG_BACK[g]||2);save();render()}}
  else if(d.autopick){const c=autoCost();if(S.gold>=c&&U('prospector')>=10){S.gold-=c;S.autopick=(S.autopick||0)+1;save();render()}}
  else if(d.mast){const k=d.mast,c=mastCost(k);if(mastOpen(k)&&S.ore>=c){S.ore-=c;S.mast=S.mast||{};S.mast[k]=mastNext(k);save();render()}}
  else if(d.up){const k=d.up,c=cost[k](S[k]);if(S.gold>=c&&S[k]<resCap(k)&&!(k==='night'&&S[k]>=NIGHT_MAX)){S.gold-=c;S[k]++;save();render()}}
  else if(t.id==='oil'){if(S.dust>=3){S.dust-=3;S.oil++;save();render()}}
  else if(t.id==='exp')startBattle('exp');
  else if(t.id==='eqbest')equipBest();
  else if(t.id==='ghost')startBattle('ghost');
  else if(t.id==='rep')startBattle('rep');
  else if(d.spd!==undefined){if(battle){battle.spd=+d.spd;if(battle.spd===0&&battle.live){battle.spd=0}document.querySelectorAll('[data-spd]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.spd===d.spd))}}
  else if(t.id==='savefile'){saveToFile()}
  else if(t.id==='loadfile'){const i=$('#loadinput');if(i){i.value='';i.click()}}
  else if(t.id==='reset'){if(!resetArm){resetArm=true;render()}else{resetArm=false;battle=null;F=null;S=Object.assign(fresh(),{slamMig:1,shopMig:1,specMig:1,statMig:1});tab='mine';syncOrders();save();render();toast('Fresh start')}}
});
document.addEventListener('keydown',e=>{if(!owns())return;if(e.code==='Space'&&F&&atStation()){e.preventDefault();strike()}});

function repair(){
  if(S.units&&!U('arcanist')&&(U('staffcarver')||U('binder')))S.units.arcanist=1; // saves from before the Sanctum keep their magic patterns
  for(const w of S.weapons||[])if(w.spec==null&&ARCH[w.arch])w.spec=U(specOf(w.arch)); // existing weapons keep today's specialist bonus, frozen
  if(!S.statMig){S.statMig=1;for(const w of S.weapons||[]){if(!ARCH[w.arch])continue;const e=w.etch||{},atk=atkStat(w.arch);if(e.Edge!=null){e.Crit=(e.Crit||0)+e.Edge;delete e.Edge}if(e.Guard!=null){e.Defense=(e.Defense||0)+e.Guard;delete e.Guard}if(atk==='Magic'&&e.Might){e.Magic=(e.Magic||0)+e.Might;delete e.Might}}
    const sc=S.scrolls||{};for(const k of Object.keys(sc)){const[g,st]=k.split('|');const nk=st==='Edge'?g+'|Crit':st==='Guard'?g+'|Defense':null;if(nk){sc[nk]=(sc[nk]||0)+sc[k];delete sc[k]}}} // Edge became Crit and Guard became Defense (2026-11-16)
  if(S.bellows>0){let g=0;for(let l=0;l<S.bellows;l++)g+=Math.round(40*Math.pow(1.9,l));S.gold=(S.gold||0)+g;S.bellows=0;setTimeout(()=>toast(`Bellows is now a Blacksmith milestone: refunded ${g} gold`),600)} // Bellows upgrade removed
  const f=fresh();
  if(S.mine&&!S.miners)S.miners=S.mine; delete S.mine;
  for(const k in f){if(typeof f[k]==='number'&&(typeof S[k]!=='number'||!isFinite(S[k])))S[k]=f[k]}
  if(!Array.isArray(S.orders))S.orders=[];
  if(!Array.isArray(S.titles))S.titles=[];while(S.titles.length<4)S.titles.push({});S.titles=S.titles.map(t=>t&&typeof t==='object'?Object.fromEntries(Object.entries(t).filter(([k,r])=>TITLES[k]&&r>=1).map(([k,r])=>[k,Math.min(TITLE_MAX,r|0)])):{});
  if(!S.cores||typeof S.cores!=='object')S.cores={};
  if(S.coal){S.ore+=S.coal}delete S.coal;delete S.shovel;delete S.carts;
  if(!S.units||typeof S.units!=='object'){const old=S.weapons.length||S.stage>1;S.units=old?{miner:S.miners||0,smith:25,merchant:15,squire:10,scribe:12}:{}}delete S.miners;
  if(S.stage>1&&S.units.quartermaster===undefined&&S.units.smith>=25){S.units.quartermaster=1;S.units.assayer=1}
  syncOrders();
  for(const c in S.cores)if(!CORES[c])delete S.cores[c];
  S.weapons.forEach(w=>{if(w.core&&!CORES[w.core])w.core=null});
  {let t=0;for(let k=0;k<=LAST_WARDEN;k++)if(S.stage>wardenStage(k))t=k+1;S.matTier=Math.max(S.matTier||0,t)}
  S.weapons.forEach(w=>{if(!MATS[w.mat])w.mat='Copper'});
  while(S.squad.length<4)S.squad.push(null);
  if(!S.tally){const t=tally();for(const w of S.weapons){t.made[w.arch]=(t.made[w.arch]||0)+1;t.total++}t.etched=S.weapons.reduce((a,w)=>a+w.res.length,0)}
  if(!S.slamMig){S.slamMig=1;if(S.units&&Object.keys(S.units).length)S.slams=Math.min(7,(S.slams||0)+2)} // blanks used to start at 5 slams
  if(S.units&&!S.shopMig){S.shopMig=1;if(U('smith')>1&&!U('shopkeeper'))S.units.shopkeeper=Math.round(U('smith')*2/3)} // Blacksmiths used to make gold
  if(S.units&&!S.specMig){S.specMig=1;const old=[[1,'Sword'],[5,'Axe'],[10,'Spear'],[15,'Bow'],[25,'Staff'],[30,'Shield'],[40,'Warhammer']]; // saves from before specialists
    for(const[n,a]of old){const k=specOf(a);if((U('smith')>=n||S.weapons.some(w=>w.arch===a))&&!U(k))S.units[k]=1}}
  if(S.units){const keys=[...new Set(RESEARCH.flatMap(r=>Object.keys(r[2])))];while(U('researcher')<30&&keys.some(k=>S[k]>resCap(k)))S.units.researcher=U('researcher')+1} // saves from before Researchers keep their upgrades
  S.weapons.forEach(w=>{w.traits=w.traits||[]});
}
function start(data){
  if(data&&data.S){S=Object.assign(fresh(),data.S)}else load();
  const localT=data&&data.S?(+data.S.t||0):(load.t||0);
  repair();save();cloudInit(localT);
  let lastDrip=Date.now();const drip=setInterval(()=>{if(!owns()){clearInterval(drip);return}const now=Date.now(),gap=(now-lastDrip)/1000;lastDrip=now;if(gap>30){awayGrant(gap);save();return}S.ore+=orePerSec()/10+(S.autopick||0)*orePerTap()/10;S.gold+=goldPerSec()/10;chips()},100); // income ticks 10 times a second so it rolls smoothly (Jonathan, 2026-11-16)
  const tk=setInterval(()=>{if(!owns()){clearInterval(tk);return}{const nw=revealUnits();if(nw.length){toast(`A ${nw[0]} is looking for work in the Workshop`);if(tab==='shop')render()}}if(tab==='shop')shopRefresh();
    if(atStation()&&!F){const h=$('#forgehint');if(h)h.textContent=forgeHint()}
    if(tickOrders(Date.now())){save();toast('A new customer is waiting in Orders');if(tab==='orders')render();else orderLabel()}
    document.querySelectorAll('.cd').forEach(el=>el.textContent=fmtCd());
    if(tab==='fight'&&!battle?.live&&(waitLeft()||/Regrouping/.test(($('#exp')||{}).textContent||''))){const e=$('#exp');if(e){e.textContent=waitLeft()?`Regrouping ${waitLeft()}s`:expLabel();e.disabled=!!waitLeft()||!S.squad.some(id=>id&&byId(id)&&byId(id).state!==1)}const rp=$('#rep');if(rp&&!waitLeft())render()}
  },1000);
  const sv=setInterval(()=>{if(!owns()){clearInterval(sv);return}save()},5000);
  render();
}
document.addEventListener('change',e=>{if(e.target&&e.target.id==='loadinput'&&e.target.files&&e.target.files[0])loadFromFile(e.target.files[0])});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){} // ask the browser not to clear this game's storage
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
